<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechReview | Iniciar Sesión</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#005BEA',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans text-gray-900 bg-gray-55 min-h-screen flex flex-col justify-center items-center p-6 bg-gray-50">

    <div class="w-full max-w-md bg-white rounded-3xl border border-gray-200/80 shadow-xl p-8 md:p-10">
        
        <div class="flex flex-col items-center text-center mb-8">
            <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-md mb-4 cursor-pointer" onclick="window.location.href='index.html'">
                <i data-lucide="smartphone" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Ingresa a TechReview</h1>
            <p class="text-sm text-gray-400 mt-1">Introduce tus credenciales para acceder a los análisis extendidos</p>
        </div>

        <form class="space-y-6" id="formLogin">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Correo electrónico</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@universidad.edu"
                        class="w-full bg-white border border-gray-300 rounded-xl pl-11 pr-4 py-3.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600 transition-all">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-sm font-semibold text-gray-700">Contraseña</label>
                    <a href="#" class="text-xs font-semibold text-brand-600 hover:underline">¿La olvidaste?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full bg-white border border-gray-300 rounded-xl pl-11 pr-4 py-3.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-brand-600 focus:ring-1 focus:ring-brand-600 transition-all">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 px-4 rounded-xl transition-all shadow-md shadow-brand-500/10 flex items-center justify-center gap-2 text-sm mt-2">
                Iniciar sesión <i data-lucide="log-in" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="text-center mt-8 pt-6 border-t border-gray-100">
            <p class="text-xs text-gray-400 font-medium">
                ¿Aún no tienes cuenta? 
                <a href="#" class="text-brand-600 font-bold hover:underline ml-1">Regístrate de forma gratuita</a>
            </p>
        </div>
    </div>

    <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-400 hover:text-gray-600 transition-colors mt-6">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Volver a la página principal
    </a>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            // Registramos la sesión activa en el almacenamiento del navegador
            localStorage.setItem('usuarioLogueado', 'true');
            
            // Redirección inmediata al index
            window.location.href = 'index.html';
        });

        lucide.createIcons();
    </script>
</body>
</html>
